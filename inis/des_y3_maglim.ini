[DEFAULT]
RUN_NAME = des_y3_maglim

%include inis/des_y3.ini

%include inis/maglim_modules.ini

[pipeline]
priors = inis/des_y3_maglim_priors.ini
values = inis/des_y3_maglim_values.ini
debug = True

[DEFAULT]
SAMPLER_NAME = test

[runtime]
sampler = %(SAMPLER_NAME)s
verbosity = quiet

[output]
filename = output/%(RUN_NAME)s_%(SAMPLER_NAME)s.txt